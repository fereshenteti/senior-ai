<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Notes</h1>
      <form id="note-form">

      <ul id="notes"></ul>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
